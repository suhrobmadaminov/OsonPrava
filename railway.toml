[build]
builder = "NIXPACKS"

[deploy]
numReplicas = 1
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4"
healthcheckPath = "/api/v1/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
