# nixpacks.toml - Railway build configuration for Web (Next.js)

[phases.setup]
nixPkgs = ["nodejs_20", "corepack"]

[phases.install]
cmds = ["corepack enable && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @osonprava/web build"]

[start]
cmd = "pnpm --filter @osonprava/web start"
