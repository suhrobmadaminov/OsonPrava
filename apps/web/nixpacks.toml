# nixpacks.toml - Railway build configuration for Web (Next.js)

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npx --yes pnpm@9.0.0 install --no-frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@9.0.0 --filter @osonprava/web build"]

[start]
cmd = "npx --yes pnpm@9.0.0 start:web"
