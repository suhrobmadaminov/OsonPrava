# nixpacks.toml - Railway build configuration for Web (Next.js)

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9.0.0 && npx pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["npx pnpm --filter @osonprava/web build"]

[start]
cmd = "npx pnpm start:web"
