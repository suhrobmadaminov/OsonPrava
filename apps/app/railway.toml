[build]
builder = "NIXPACKS"
buildCommand = "npx --yes pnpm@9.0.0 install && npx --yes pnpm@9.0.0 build"

[deploy]
numReplicas = 1
# Vite build output: apps/app/dist (SPA/PWA)
# Serve static files on Railway's PORT
startCommand = "npx --yes serve@14.2.0 -s dist -l $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

