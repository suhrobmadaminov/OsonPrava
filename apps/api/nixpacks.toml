# nixpacks.toml - Railway build configuration for API

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9.0.0 && pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @osonprava/api build", "pnpm --filter @osonprava/api exec prisma generate"]

[start]
cmd = "pnpm db:migrate:deploy && pnpm start:api"
