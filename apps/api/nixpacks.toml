# nixpacks.toml - Railway build configuration for API

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9.0.0 && npx pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["npx pnpm --filter @osonprava/api build", "npx pnpm --filter @osonprava/api exec prisma generate"]

[start]
cmd = "npx pnpm db:migrate:deploy && npx pnpm start:api"
