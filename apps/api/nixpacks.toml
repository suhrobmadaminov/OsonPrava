[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npx --yes pnpm@9.0.0 install --no-frozen-lockfile"]

[phases.build]
cmds = ["npx --yes pnpm@9.0.0 --filter @osonprava/api build", "npx --yes pnpm@9.0.0 --filter @osonprava/api exec prisma generate"]

[start]
cmd = "npx --yes pnpm@9.0.0 db:migrate:deploy && npx --yes pnpm@9.0.0 start:api"
