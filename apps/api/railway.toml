[build]
builder = "NIXPACKS"
buildCommand = "npx --yes pnpm@9.0.0 build && npx --yes pnpm@9.0.0 exec prisma generate"

[deploy]
numReplicas = 1
startCommand = "npx --yes pnpm@9.0.0 exec prisma migrate deploy && npx --yes pnpm@9.0.0 start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
